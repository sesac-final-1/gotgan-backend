spring:
  application:
    name: user-service                  # 지표 · 로그의 app 이름이 된다 (컨벤션 5-3 라벨)

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/userdb?connectionTimeZone=Asia/Seoul
    username: ${DB_USERNAME:user}       # 클러스터에서는 ESO 가 만든 Secret → 환경 변수
    password: ${DB_PASSWORD:local-pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate                    # 스키마는 Flyway 만 바꾼다 (컨벤션 3-10)
  flyway:
    locations: classpath:db/migration       # 시드(db/seed) 는 local · k8s 프로필에서만 추가

  lifecycle:
    timeout-per-shutdown-phase: 30s         # 처리 중인 요청을 마치는 최대 시간 (terminationGracePeriodSeconds 보다 짧게)

server:
  port: 8081
  shutdown: graceful                        # 롤링 업데이트 때 처리 중인 요청을 마치고 종료

app:
  client:
    connect-timeout: 2s                     # 모든 동기 호출 공통 (RestClientConfig 가 읽음)
    read-timeout: 3s
  keycloak:
    base-url: ${KEYCLOAK_URI:http://localhost:8180}          # 클러스터: http://keycloak:8080
    realm: gotgan
    token-uri: ${app.keycloak.base-url}/realms/gotgan/protocol/openid-connect/token
    logout-uri: ${app.keycloak.base-url}/realms/gotgan/protocol/openid-connect/logout
    admin-uri: ${app.keycloak.base-url}/admin/realms/gotgan
    client-id: gotgan-backend
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}                 # 비밀 값은 환경 변수로만 (컨벤션 1-5)
  auth:
    refresh-cookie-name: refresh_token
    refresh-cookie-path: /api/auth                            # /api/auth/** 요청에만 실림 (refresh · logout)
    refresh-cookie-secure: true                               # HTTPS 만 — 브라우저는 localhost 는 예외로 허용
  store:
    mock-closed-store-ids:                                    # TODO(store 개발 완료 시 삭제) MockStoreClient — 폐점으로 볼 store_id (기본: 없음 = 전부 ACTIVE)
  point:
    earn-rate: 0.05                                           # 실결제금액의 5% 적립 (정리 문서 8-5)
  sqs:
    queue-url: ${USER_EVENTS_QUEUE_URL:}   # 구독 큐 (sesac-gojigi-user-{도메인}-events)

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50          # 최근 10건 중 50% 실패면 OPEN → 바로 폴백
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:                  # 장애로 세는 것: 연결 실패 · 타임아웃 · 5xx
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:                  # 비밀번호 불일치 등 4xx(비즈니스 오류로 변환)는 세지 않음
          - com.sesac.gojigi.user.common.exception.BusinessException
    instances:
      keycloak: { base-config: default }    # KeycloakClientAdapter — 토큰 요청(POST)은 재시도 없음
  retry:
    configs:
      default:
        max-attempts: 2                     # 재시도는 멱등 GET 에만 (POST 는 재시도 금지)
        wait-duration: 200ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true                       # /actuator/health/liveness · readiness
  health:
    circuitbreakers:
      enabled: false                        # 서킷이 열려도 내 파드는 건강함 — 다른 서비스 장애로 재시작되지 않게

springdoc:
  swagger-ui:
    path: /swagger-ui.html
