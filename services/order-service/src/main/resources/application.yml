spring:
  application:
    name: order-service                  # 지표 · 로그의 app 이름이 된다 (컨벤션 5-3 라벨)

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/orderdb?connectionTimeZone=Asia/Seoul
    username: ${DB_USERNAME:order}       # 클러스터에서는 ESO 가 만든 Secret → 환경 변수
    password: ${DB_PASSWORD:local-pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate                    # 스키마는 Flyway 만 바꾼다 (컨벤션 3-10)
  flyway:
    locations: classpath:db/migration       # 시드(db/seed) 는 local · k8s 프로필에서만 추가

  data:
    redis:
      host: ${REDIS_HOST:localhost}

  lifecycle:
    timeout-per-shutdown-phase: 30s         # 처리 중인 요청을 마치는 최대 시간 (terminationGracePeriodSeconds 보다 짧게)

server:
  # 클러스터 내부 전용(ClusterIP) — 외부 요청은 gateway(NLB 80) 를 거쳐서만 들어온다
  port: 8084
  shutdown: graceful                        # 롤링 업데이트 때 처리 중인 요청을 마치고 종료

app:
  client:
    connect-timeout: 2s                     # 모든 동기 호출 공통 (RestClientConfig 가 읽음)
    read-timeout: 3s
    user-url: ${USER_SERVICE_URI:http://localhost:8081}
    store-url: ${STORE_SERVICE_URI:http://localhost:8082}
    product-url: ${PRODUCT_SERVICE_URI:http://localhost:8083}
    payment-url: ${PAYMENT_SERVICE_URI:http://localhost:8086}
    product-mock: ${PRODUCT_CLIENT_MOCK:true}   # TODO(product 내부 API 구현 시 false): 그 전에는 MockProductClient
  order:
    auto-confirm-after: ${AUTO_CONFIRM_AFTER:7d}   # 데모에서는 ConfigMap 으로 2m
    payment-timeout: ${PAYMENT_TIMEOUT:15m}         # 결제 대기 만료 기준 — 데모에서는 ConfigMap 으로 1m
    return-window: ${RETURN_WINDOW:7d}              # 배송완료 후 반품 · 교환 신청 기간 (CLM-03 · 04)
    auto-deliver-after: ${AUTO_DELIVER_AFTER:1h}    # 발송 후 자동 배송완료 (DLV-04) — 데모에서는 ConfigMap 으로 1m
  events:
    topic-arn: ${ORDER_EVENTS_TOPIC_ARN:}   # SNS sesac-gojigi-order-events — 비면(로컬 · 테스트) 발행하지 않고 로그만
    outbox:                                  # 이벤트 아웃박스 (EventOutboxService · V6) — 커밋 후 바로 발행, 실패분은 발행기가 다시
      publish-interval: 30s
      initial-delay: 20s
      retry-after: 10s                       # 커밋 직후 발행과 겹치지 않게 이만큼 지난 NEW 만
      max-attempts: 10                       # 넘으면 ERROR 로그 (수동 확인)
  scheduler:
    zone: Asia/Seoul
    batch-size: 100                         # 한 주기에 처리할 Saga 최대 건수
    payment-expiry:                         # PaymentExpiryScheduler — 결제 대기 만료 (ORD-07)
      interval: ${PAYMENT_EXPIRY_INTERVAL:60s}
      initial-delay: 30s
    auto-deliver:                           # AutoDeliverScheduler — 배송중 → 자동 배송완료 (DLV-04)
      interval: ${AUTO_DELIVER_INTERVAL:60s}
      initial-delay: 30s
    saga-recovery:                          # SagaRecoveryScheduler — 멈춘 Saga · 보상 재시도 (ORD-07)
      interval: ${SAGA_RECOVERY_INTERVAL:60s}
      initial-delay: 30s
      stalled-after: 5m                     # 결제 준비 전 단계에서 이만큼 진행이 없으면 멈춘 것으로 본다

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50          # 최근 10건 중 50% 실패면 OPEN → 바로 폴백
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      remote:                               # 다른 서비스 호출 (order/client/*ClientAdapter)
        base-config: default
        record-exceptions:                  # 장애로 세는 것: 연결 실패 · 타임아웃 · 5xx
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:                  # 재고 부족 · 포인트 부족 등 4xx(비즈니스 오류로 변환)는 세지 않음
          - com.sesac.gojigi.common.web.exception.BusinessException
    instances:
      user: { base-config: remote }
      store: { base-config: remote }
      product: { base-config: remote }
      payment: { base-config: remote }
      redisCart: { base-config: default }     # 장바구니 Redis 캐시 — OPEN 이면 MySQL cart_item 폴백 (결정 4, cart/package-info)
  retry:
    configs:
      default:
        max-attempts: 2                     # 재시도는 멱등 GET 에만 (POST 는 재시도 금지)
        wait-duration: 200ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - com.sesac.gojigi.common.web.exception.BusinessException
    instances:
      user: { base-config: default }        # UserClientAdapter#getUser 에만 적용
      store: { base-config: default }       # StoreClientAdapter#getStore
      product: { base-config: default }     # ProductClientAdapter#getOptions 에만 적용

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true                       # /actuator/health/liveness · readiness
  health:
    circuitbreakers:
      enabled: false                        # 서킷이 열려도 내 파드는 건강함 — 다른 서비스 장애로 재시작되지 않게

springdoc:
  swagger-ui:
    path: /swagger-ui.html
