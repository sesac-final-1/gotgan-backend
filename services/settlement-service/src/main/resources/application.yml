spring:
  application:
    name: settlement-service                  # 지표 · 로그의 app 이름이 된다 (컨벤션 5-3 라벨)

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/settlementdb?connectionTimeZone=Asia/Seoul
    username: ${DB_USERNAME:settlement}       # 클러스터에서는 secrets-sync 가 만든 settlement-service-secret → 환경 변수
    password: ${DB_PASSWORD:local-pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate                    # 스키마는 Flyway 만 바꾼다 (컨벤션 3-10)
  flyway:
    locations: classpath:db/migration       # 시드(db/seed) 는 local · k8s 프로필에서만 추가

  lifecycle:
    timeout-per-shutdown-phase: 30s         # 처리 중인 요청을 마치는 최대 시간 (terminationGracePeriodSeconds 보다 짧게)

server:
  port: 8085
  shutdown: graceful                        # 롤링 업데이트 때 처리 중인 요청을 마치고 종료

app:
  client:
    connect-timeout: 2s                     # 모든 동기 호출 공통 (RestClientConfig 가 읽음)
    read-timeout: 3s
  events:
    topic-arn: ${SETTLEMENT_EVENTS_TOPIC_ARN:}   # SNS sesac-gojigi-settlement-events
  sqs:                                       # 구독 큐 2개 — URL 이 비면(로컬 · 테스트) 폴러를 띄우지 않는다
    store-events-queue-url: ${SETTLEMENT_STORE_EVENTS_QUEUE_URL:}   # StoreApproved · StoreStatusChanged
    order-events-queue-url: ${SETTLEMENT_ORDER_EVENTS_QUEUE_URL:}   # OrderItemConfirmed
    wait-seconds: 20                         # 롱폴링 (비어 있어도 20초 기다렸다 돌아옴 — 빈 요청 비용 절감)
    max-messages: 10
  reports:
    bucket: ${REPORTS_BUCKET:}                # 정산 명세서 CSV (Lambda settlement-report 가 생성) — presigned GET
  scheduler:
    zone: Asia/Seoul
    weekly-aggregation-cron: "0 0 3 * * MON"   # 주간 정산 집계 (KST) — 시연은 관리자 "지금 집계"
    catch-up-on-startup: true                # 기동 시 지난주 집계 — 클러스터가 07:00~21:00 만 떠 있어 03:00 cron 이 안 도는 문제 보완 (멱등)

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true                       # /actuator/health/liveness · readiness

springdoc:
  swagger-ui:
    path: /swagger-ui.html
