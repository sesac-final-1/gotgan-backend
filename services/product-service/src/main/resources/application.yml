spring:
  application:
    name: product-service                  # 지표 · 로그의 app 이름이 된다 (컨벤션 5-3 라벨)

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/productdb?connectionTimeZone=Asia/Seoul
    username: ${DB_USERNAME:product}       # 클러스터에서는 ESO 가 만든 Secret → 환경 변수
    password: ${DB_PASSWORD:local-pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate                    # 스키마는 Flyway 만 바꾼다 (컨벤션 3-10)
  flyway:
    locations: classpath:db/migration       # 시드(db/seed) 는 local · k8s 프로필에서만 추가

  lifecycle:
    timeout-per-shutdown-phase: 30s         # 처리 중인 요청을 마치는 최대 시간 (terminationGracePeriodSeconds 보다 짧게)

server:
  port: 8083
  shutdown: graceful                        # 롤링 업데이트 때 처리 중인 요청을 마치고 종료

app:
  client:
    connect-timeout: 2s                     # 모든 동기 호출 공통 (RestClientConfig 가 읽음)
    read-timeout: 3s
  sqs:
    queue-url: ${PRODUCT_EVENTS_QUEUE_URL:}   # 구독 큐 (sesac-gojigi-product-{도메인}-events)
  images:
    base-url: ${IMAGES_BASE_URL:https://sesac-gojigi-images-4380.s3.ap-northeast-2.amazonaws.com}   # 이미지 URL = base-url/{s3Key} (ConfigMap)

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true                       # /actuator/health/liveness · readiness

springdoc:
  swagger-ui:
    path: /swagger-ui.html
