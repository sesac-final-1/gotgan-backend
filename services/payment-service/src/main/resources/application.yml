spring:
  application:
    name: payment-service                  # 지표 · 로그의 app 이름이 된다 (컨벤션 5-3 라벨)

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/paymentdb?connectionTimeZone=Asia/Seoul
    username: ${DB_USERNAME:payment}       # 클러스터에서는 secrets-sync 가 만든 payment-service-secret → 환경 변수
    password: ${DB_PASSWORD:local-pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate                    # 스키마는 Flyway 만 바꾼다 (컨벤션 3-10)
  flyway:
    locations: classpath:db/migration       # 시드(db/seed) 는 local · k8s 프로필에서만 추가

  lifecycle:
    timeout-per-shutdown-phase: 30s         # 처리 중인 요청을 마치는 최대 시간 (terminationGracePeriodSeconds 보다 짧게)

server:
  # 클러스터 내부 전용(ClusterIP) — 외부 요청은 gateway(NLB 80) 를 거쳐서만 들어온다
  port: 8086
  shutdown: graceful                        # 롤링 업데이트 때 처리 중인 요청을 마치고 종료

app:
  client:
    connect-timeout: 2s                     # 모든 동기 호출 공통 (RestClientConfig 가 읽음)
    read-timeout: 3s
  portone:
    api-base-url: https://api.portone.io
    api-secret: ${PORTONE_API_SECRET:}            # GitHub Secret → secrets-sync → payment-service-secret (로그 금지)
    webhook-secret: ${PORTONE_WEBHOOK_SECRET:}    # Standard Webhooks 서명 검증 (whsec_...)
    webhook-tolerance: 5m                   # 웹훅 시각 허용 범위 — 재전송 공격 방지
  cancel-recovery:                          # 취소 복구 스케줄러 (PaymentCancelRecoveryScheduler · payment.md 8절)
    interval: 60s                           # 주기 (끝난 뒤 60초)
    initial-delay: 30s
    stale-after: 60s                        # 이만큼 확정되지 않은 PENDING 만 — 진행 중인 요청과 겹치지 않게
    batch-size: 20
    max-attempts: 10                        # 넘으면 ERROR 로그 + payment_cancel_unresolved_total (수동 확인)

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50          # 최근 10건 중 50% 실패면 OPEN → 바로 폴백
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:                  # 장애로 세는 것: 연결 실패 · 타임아웃 · 5xx
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:                  # 포트원의 4xx 거절(비즈니스 오류로 변환)은 세지 않음
          - com.sesac.gojigi.common.web.exception.BusinessException
    instances:
      portone: { base-config: default }     # 이름 = 대상 서비스 (가이드라인 06장)
  retry:
    configs:
      default:
        max-attempts: 2                     # 재시도는 멱등 GET 에만 (POST 는 재시도 금지)
        wait-duration: 200ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - com.sesac.gojigi.common.web.exception.BusinessException
    instances:
      portone: { base-config: default }     # PortOneClientAdapter#getPayment 에만 적용

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true                       # /actuator/health/liveness · readiness
  health:
    circuitbreakers:
      enabled: false                        # 서킷이 열려도 내 파드는 건강함 — 다른 서비스 장애로 재시작되지 않게

springdoc:
  swagger-ui:
    path: /swagger-ui.html
