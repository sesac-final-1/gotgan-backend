spring:
  application:
    name: gateway-service                  # 지표 · 로그의 app 이름이 된다 (컨벤션 5-3 라벨)

  lifecycle:
    timeout-per-shutdown-phase: 30s         # 처리 중인 요청을 마치는 최대 시간 (terminationGracePeriodSeconds 보다 짧게)

  cloud:
    gateway:
      server:
        webflux:
          # 실시간 알림(SSE, NTF-08 · 10/27)은 화면이 api.gotgan.click 에 직접 연결한다 — Vercel rewrite 는 장시간 스트리밍 응답에 맞지 않아서.
          # 그래서 이 경로만 프론트 출처(운영 · Vercel 미리보기 · 로컬 Vite)의 교차 출처 GET 을 허용(Authorization 헤더 → preflight, 보안 설정이 OPTIONS 통과).
          # 나머지 API 는 지금처럼 Vercel rewrite(같은 출처)라 CORS 를 열지 않는다
          globalcors:
            cors-configurations:
              '[/api/notifications/stream]':
                allowed-origin-patterns: https://gotgan-ashy.vercel.app, https://gotgan-*-jihoon-dev.vercel.app, http://localhost:5173
                allowed-methods: GET
                allowed-headers: Authorization, Accept, Cache-Control, Last-Event-ID
                max-age: 3600
              # 1:1 채팅 실시간(STOMP over WebSocket, 10/27) — 같은 이유로 직접 연결. 핸드셰이크(GET + Upgrade)는 preflight 가 없어 이 설정은 Origin 확인 용도
              # (프론트 출처가 아니면 403). 토큰은 STOMP CONNECT 프레임에 실어 chat-service 가 검증한다 (브라우저 WebSocket 은 Authorization 헤더를 못 붙임)
              '[/ws/chat]':
                allowed-origin-patterns: https://gotgan-ashy.vercel.app, https://gotgan-*-jihoon-dev.vercel.app, http://localhost:5173
                allowed-methods: GET
                max-age: 3600
          # 요청 제한(T3) — RequestRateLimiter + RedisRateLimiter(토큰 버킷, Redis 로 레플리카끼리 함께 센다). 키는 RateLimitKeyResolver(user · ip · direct),
          # 라우트마다 따로 센다. 넘으면 429 + X-RateLimit-* 헤더(본문 없음 — 프론트는 상태 코드로 처리), Redis 장애면 통과(fail-open).
          # 한도는 app.rate-limit. **새 라우트를 만들면 rate-limit-default 를 붙인다** — 붙이지 않는 것은 웹훅 · Keycloak · 채팅 WS 뿐
          routes:                           # 경로 규칙: 정리 문서 8-3 · 컨벤션 2-4. /internal/** 은 라우트 없음 (외부에서 닿지 않음)
            - id: user-auth-strict          # 로그인 · 가입만 — 비로그인이라 IP 로 세고 한도를 낮게 (한 곳에서 여러 계정 로그인 시도 · 가입 도배). 계정별 시도는 Keycloak 잠금(5회)
              uri: ${USER_SERVICE_URI:http://localhost:8081}   # user-auth 보다 먼저 — 라우트는 위에서부터 맞춘다
              predicates:
                - Path=/api/auth/login,/api/auth/signup
                - Method=POST
              filters:
                - &rate-limit-auth
                  name: RequestRateLimiter
                  args:
                    key-resolver: "#{@rateLimitKeyResolver}"
                    redis-rate-limiter.replenish-rate: ${app.rate-limit.auth.replenish-rate}
                    redis-rate-limiter.burst-capacity: ${app.rate-limit.auth.burst-capacity}
                    redis-rate-limiter.requested-tokens: ${app.rate-limit.auth.requested-tokens}
            - id: user-auth                 # 나머지 /api/auth/** — refresh · 로그아웃 · 소셜 로그인 · 이메일 중복 확인. refresh 는 새로고침 · 401 마다 불려서
              uri: ${USER_SERVICE_URI:http://localhost:8081}   # 엄격한 한도에 넣으면 탭 여러 개 · 같은 공인 IP(강의장 NAT)에서 재발급이 429 → 로그아웃처럼 보임
              predicates:
                - Path=/api/auth/**
              filters:
                - &rate-limit-default
                  name: RequestRateLimiter
                  args:
                    key-resolver: "#{@rateLimitKeyResolver}"
                    redis-rate-limiter.replenish-rate: ${app.rate-limit.default.replenish-rate}
                    redis-rate-limiter.burst-capacity: ${app.rate-limit.default.burst-capacity}
                    redis-rate-limiter.requested-tokens: ${app.rate-limit.default.requested-tokens}
            - id: user-service
              uri: ${USER_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/users/**
              filters:
                - *rate-limit-default
            - id: store-service
              uri: ${STORE_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/stores/**,/api/seller/apply/**,/api/seller/store/**,/api/seller/dashboard
              filters:
                - *rate-limit-default
            - id: product-service
              uri: ${PRODUCT_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/products/**,/api/categories/**,/api/seller/products/**
              filters:
                - *rate-limit-default
            - id: order-service
              uri: ${ORDER_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/carts/**,/api/orders/**,/api/seller/order-items/**,/api/seller/claims/**
              filters:
                - *rate-limit-default
            - id: settlement-service
              uri: ${SETTLEMENT_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/api/seller/settlements/**
              filters:
                - *rate-limit-default
            - id: payment-service           # 포트원 웹훅 — 요청 제한 없음 (외부 서버 콜백, 서명은 payment 가 검증)
              uri: ${PAYMENT_SERVICE_URI:http://localhost:8086}
              predicates:
                - Path=/api/payments/webhook
            - id: review-service
              uri: ${REVIEW_SERVICE_URI:http://localhost:8087}
              predicates:
                - Path=/api/reviews/**,/api/inquiries/**,/api/seller/reviews/**,/api/seller/inquiries/**
              filters:
                - *rate-limit-default
            - id: admin-service
              uri: ${ADMIN_SERVICE_URI:http://localhost:8088}
              predicates:
                - Path=/api/admin/**,/api/reports/**,/api/notifications/**   # 신고 접수(구매자 · 판매자) · 알림 센터(로그인한 누구나 — NTF-08, 10/27)도 admin-service
              filters:
                - *rate-limit-default       # SSE 스트림은 연결 1번이 요청 1건이라 함께 세도 됨
            - id: keycloak                  # 소셜 로그인 — 브라우저가 Keycloak 로그인 · 제공자 복귀(broker) 화면으로 온다. gotgan realm 과 화면 리소스만 (관리 콘솔 · master realm 은 열지 않음)
              uri: ${KEYCLOAK_URI:http://localhost:8180}   # 요청 제한 없음 — 화면 리소스(js · css) 요청이 많고, 로그인 시도는 Keycloak 브루트포스 잠금이 막음
              predicates:
                - Path=/realms/gotgan/**,/resources/**
            - id: chat-service              # 1:1 채팅 REST (10/27)
              uri: ${CHAT_SERVICE_URI:http://localhost:8089}
              predicates:
                - Path=/api/chats/**
              filters:
                - *rate-limit-default
            - id: chat-websocket            # /ws/chat — Upgrade: websocket 이면 게이트웨이가 ws:// 로 바꿔 그대로 잇는다. 요청 제한 없음 (전송 속도는 chat-service 가 연결마다 1초 5건)
              uri: ${CHAT_SERVICE_URI:http://localhost:8089}
              predicates:
                - Path=/ws/chat
  security:
    oauth2:
      resourceserver:
        jwt:
          # iss 는 Keycloak 공개 주소(KC_HOSTNAME, 클러스터 https://api.gotgan.click), 공개키는 내부 주소에서 받는다 — jwk-set-uri 가 있으면 issuer 조회 없이 검증만
          issuer-uri: ${KEYCLOAK_ISSUER:${KEYCLOAK_URI:http://localhost:8180}/realms/gotgan}   # 토큰의 iss 와 정확히 같아야 함 (가이드라인 08장)
          jwk-set-uri: ${KEYCLOAK_URI:http://localhost:8180}/realms/gotgan/protocol/openid-connect/certs

  data:
    redis:
      host: ${REDIS_HOST:localhost}         # 차단 목록 조회 (user-service 가 탈퇴 시 저장) · 요청 제한 토큰 버킷
      timeout: 500ms                        # 응답이 늦으면 기다리지 않고 통과 — 요청마다 붙는 확인이라 짧게

server:
  # 외부 접속은 NLB 443(TLS 종료) → 이 포트(8080) — gotgan-config Helm values gateway service.port: 443
  port: 8080
  shutdown: graceful                        # 롤링 업데이트 때 처리 중인 요청을 마치고 종료

app:
  rate-limit:                               # 키(user · ip · direct)마다, 라우트마다 — replenish-rate 초당 충전 토큰, burst-capacity 최대 토큰, requested-tokens 요청 1건이 쓰는 토큰
    auth:                                   # POST 로그인 · 가입 — 분당 30회 (2초에 1회꼴, 몰아서 30회까지). 같은 공인 IP(강의장 NAT)를 여럿이 나눠 써도 걸리지 않게
      replenish-rate: ${RATE_LIMIT_AUTH_REPLENISH:1}
      burst-capacity: ${RATE_LIMIT_AUTH_BURST:60}
      requested-tokens: ${RATE_LIMIT_AUTH_TOKENS:2}
    default:                                # 그 밖의 API — 초당 20회 (몰아서 40회까지). 화면 한 번에 API 여러 개를 불러도 걸리지 않게 넉넉히
      replenish-rate: ${RATE_LIMIT_DEFAULT_REPLENISH:20}
      burst-capacity: ${RATE_LIMIT_DEFAULT_BURST:40}
      requested-tokens: ${RATE_LIMIT_DEFAULT_TOKENS:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      redisBlocklist:                       # BlockedUserFilter — Redis 장애 시 OPEN 이면 조회 없이 바로 통과 (fail-open)
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
