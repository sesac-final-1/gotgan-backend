// gateway-service — Spring Cloud Gateway · JWT 검증(Keycloak JWKS) · 사용자 헤더 주입 · CORS
// 의존성 선택 기준: 가이드라인 15장 4절 "의존성 매트릭스". 버전 변수는 gradle.properties (전 서비스 동일)
plugins {
    id 'java'
    id 'jacoco'                                                 // SonarQube Cloud 커버리지 리포트 (루트 sonar-project.properties 가 XML 경로 참조)
    id 'org.springframework.boot' version '4.1.1'              // 전 서비스 같은 버전
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sesac.gojigi'
version = '0.0.1'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "software.amazon.awssdk:bom:${awsSdkVersion}"
    }
}

dependencies {
    // 게이트웨이 (WebFlux) · Keycloak JWKS 로 JWT 검증 (가이드라인 08장)
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    // 차단 목록(blocked:user:{id}) 조회 — 탈퇴 회원의 남은 Access Token 차단. Redis 장애 시 서킷 열고 통과 (fail-open)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation "io.github.resilience4j:resilience4j-spring-boot4:${resilience4jVersion}"
    implementation "io.github.resilience4j:resilience4j-reactor:${resilience4jVersion}"
    // 관측성 (가이드라인 13장)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly    'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-zipkin'
    implementation "com.github.loki4j:loki-logback-appender:${loki4jVersion}"
    // Lombok — 생성자 주입(@RequiredArgsConstructor) · @Getter · @Slf4j (컨벤션 2-3)
    compileOnly         'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // 테스트 (Boot 4는 기술별 테스트 스타터)
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
    testImplementation 'org.springframework.security:spring-security-test'   // mockJwt — 경로별 인가 테스트
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'
}

tasks.named('bootJar') { archiveFileName = 'app.jar' }   // Dockerfile 이 파일 이름을 고정해서 참조
tasks.named('jar')     { enabled = false }                // -plain.jar 를 만들지 않음
tasks.named('test')    { useJUnitPlatform(); finalizedBy jacocoTestReport }
jacocoTestReport       { reports { xml.required = true } }   // Sonar 가 읽는 XML
