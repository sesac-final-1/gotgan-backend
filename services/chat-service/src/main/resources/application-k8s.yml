# 클러스터용 — ConfigMap 의 SPRING_PROFILES_ACTIVE=k8s 로 활성화 (가이드라인 15장 6절)
management:
  tracing:
    sampling:
      probability: 1.0                      # 시연의 로그 ↔ 트레이스 연결을 위해 전부 수집 (11/3 결정, k6 결과도 1.0 기준)
    export:
      zipkin:                               # Boot 4 키. 옛 management.zipkin.tracing.* 는 무시되고 localhost 로 보냄
        endpoint: ${ZIPKIN_ENDPOINT:http://zipkin.monitoring.svc.cluster.local:9411/api/v2/spans}
