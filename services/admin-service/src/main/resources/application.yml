spring:
  application:
    name: admin-service                  # 지표 · 로그의 app 이름이 된다 (컨벤션 5-3 라벨)

  lifecycle:
    timeout-per-shutdown-phase: 30s         # 처리 중인 요청을 마치는 최대 시간 (terminationGracePeriodSeconds 보다 짧게)

server:
  # 클러스터 내부 전용(ClusterIP) — 외부 요청은 gateway(NLB 80) 를 거쳐서만 들어온다
  port: 8088
  shutdown: graceful                        # 롤링 업데이트 때 처리 중인 요청을 마치고 종료

app:
  client:
    connect-timeout: 2s                     # 모든 동기 호출 공통 (RestClientConfig 가 읽음)
    read-timeout: 3s
    store-url: ${STORE_SERVICE_URI:http://localhost:8082}
    product-url: ${PRODUCT_SERVICE_URI:http://localhost:8083}
    settlement-url: ${SETTLEMENT_SERVICE_URI:http://localhost:8085}
    user-url: ${USER_SERVICE_URI:http://localhost:8081}
    order-url: ${ORDER_SERVICE_URI:http://localhost:8084}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50          # 최근 10건 중 50% 실패면 OPEN → 바로 폴백
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      storeClient: { base-config: default }
      productClient: { base-config: default }
      settlementClient: { base-config: default }
      userClient: { base-config: default }
      orderClient: { base-config: default }
  retry:
    configs:
      default:
        max-attempts: 2                     # 재시도는 멱등 GET 에만 (POST 는 재시도 금지)
        wait-duration: 200ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true                       # /actuator/health/liveness · readiness
  health:
    circuitbreakers:
      enabled: false                        # 서킷이 열려도 내 파드는 건강함 — 다른 서비스 장애로 재시작되지 않게

springdoc:
  swagger-ui:
    path: /swagger-ui.html
