spring:
  application:
    name: admin-service                  # 지표 · 로그의 app 이름이 된다 (컨벤션 5-3 라벨)

  # admindb — 신고 · 조치 이력만 (ADR-0001 예외, 10/26). 다른 서비스 데이터는 갖지 않는다
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/admindb?connectionTimeZone=Asia/Seoul
    username: ${DB_USERNAME:admin}            # 클러스터에서는 secrets-sync 가 만든 admin-service-secret → 환경 변수
    password: ${DB_PASSWORD:local-pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate                    # 스키마는 Flyway 만 바꾼다 (컨벤션 3-10)
  flyway:
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}        # 알림 센터 — 파드 간 실시간 전달(Pub/Sub 채널 notify:{받는 쪽})

  lifecycle:
    timeout-per-shutdown-phase: 30s         # 처리 중인 요청을 마치는 최대 시간 (terminationGracePeriodSeconds 보다 짧게)

server:
  # 클러스터 내부 전용(ClusterIP) — 외부 요청은 gateway(NLB 80) 를 거쳐서만 들어온다
  port: 8088
  shutdown: graceful                        # 롤링 업데이트 때 처리 중인 요청을 마치고 종료

app:
  client:
    connect-timeout: 2s                     # 모든 동기 호출 공통 (RestClientConfig 가 읽음)
    read-timeout: 3s
    store-url: ${STORE_SERVICE_URI:http://localhost:8082}
    product-url: ${PRODUCT_SERVICE_URI:http://localhost:8083}
    settlement-url: ${SETTLEMENT_SERVICE_URI:http://localhost:8085}
    user-url: ${USER_SERVICE_URI:http://localhost:8081}
    order-url: ${ORDER_SERVICE_URI:http://localhost:8084}
    review-url: ${REVIEW_SERVICE_URI:http://localhost:8087}
  notification:                             # 알림 센터 (NTF-08, 10/27)
    inbox-table: ${INBOX_TABLE:sesac-gojigi-inbox}
    realtime: ${NOTIFICATION_REALTIME:redis} # redis = 파드 간 전달 · local = 이 파드에 연결된 화면에만(테스트 · 로컬)
    heartbeat: 25s                          # SSE 연결 유지 — NLB idle 350초 · 브라우저 · 프록시가 끊지 않게
    queues:                                 # 이벤트 구독 큐 — URL 이 비면(로컬 · 테스트) 폴러를 띄우지 않는다
      store: ${ADMIN_STORE_EVENTS_QUEUE_URL:}
      order: ${ADMIN_ORDER_EVENTS_QUEUE_URL:}
      settlement: ${ADMIN_SETTLEMENT_EVENTS_QUEUE_URL:}

resilience4j:
  circuitbreaker:
    circuit-breaker-aspect-order: 1         # 서킷이 바깥 · 재시도가 안쪽 — 기본(재시도 바깥)이면 서킷 폴백이 먼저 502 로 바꿔 재시도가 안 걸린다
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50          # 최근 10건 중 50% 실패면 OPEN → 바로 폴백
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      remote:                               # 다른 서비스 호출 ({domain}/client/*ClientAdapter) — 인스턴스 이름 = 대상 서비스
        base-config: default
        record-exceptions:                  # 장애로 세는 것: 연결 실패 · 타임아웃 · 5xx
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:                  # 4xx(대상 서비스의 code 를 그대로 전달하는 BusinessException)는 세지 않음
          - com.sesac.gojigi.common.web.exception.BusinessException
    instances:
      user: { base-config: remote }
      settlement: { base-config: remote }
      product: { base-config: remote }      # 카테고리 관리 · 관리자 상품 · 상품 통계
      order: { base-config: remote }        # 대시보드 주문 통계
      store: { base-config: remote }        # 입점 심사 · 스토어 관리 (store.md #97 계약)
      review: { base-config: remote }       # 신고 — 리뷰 조회 · 블라인드
  retry:
    retry-aspect-order: 2
    configs:
      default:
        max-attempts: 2                     # 재시도는 멱등 GET 에만 (POST · PUT · PATCH 는 재시도 금지)
        wait-duration: 200ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - com.sesac.gojigi.common.web.exception.BusinessException
    instances:
      user: { base-config: default }        # UserClientAdapter 의 GET 에만
      settlement: { base-config: default }  # SettlementClientAdapter 의 GET 에만
      product: { base-config: default }     # ProductClientAdapter#categories · AdminProductClientAdapter 의 GET 에만
      order: { base-config: default }       # OrderClientAdapter#platformStats · dailyStats
      store: { base-config: default }       # StoreClientAdapter 의 GET 에만
      review: { base-config: default }      # ReviewClientAdapter#get 에만

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true                       # /actuator/health/liveness · readiness
  health:
    circuitbreakers:
      enabled: false                        # 서킷이 열려도 내 파드는 건강함 — 다른 서비스 장애로 재시작되지 않게

springdoc:
  swagger-ui:
    path: /swagger-ui.html
