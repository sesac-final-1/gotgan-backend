# SonarQube Cloud CI 분석 설정 — backend.yml 의 sonar job 이 sonarqube-scan-action 으로 읽는다 (가이드라인 12장 · 컨벤션 1-3)
# 서비스 9개(독립 Gradle 프로젝트)를 프로젝트 하나로 스캔. 서비스 추가 시 별도 수정 불필요 (services/*-service 와일드카드)
sonar.organization=sesac-gojigi
sonar.projectKey=sesac-final-1_gotgan-backend
sonar.projectName=gotgan-backend

sonar.sourceEncoding=UTF-8
sonar.java.source=21

# 소스 · 테스트 — services/{서비스}-service/src/main · src/test
sonar.sources=services
sonar.tests=services
sonar.inclusions=services/*-service/src/main/**
sonar.test.inclusions=services/*-service/src/test/**

# 중복 검사 제외 — common/ 은 서비스 템플릿을 9개 서비스에 그대로 복사한 공통 코드 (README · 컨벤션 4장 프로젝트 구조)
#   ApiResponse · 예외 · @CurrentUser · 설정 등이 서비스마다 같아 중복률이 부풀려지므로 중복 계산에서만 뺀다
#   버그 · 취약점 · 코드 스멜 분석은 그대로. 도메인 코드(서비스 고유 패키지)의 중복은 계속 검사
sonar.cpd.exclusions=services/*-service/src/main/java/**/common/**

# Java 분석에 필요한 컴파일 결과 (sonar job 이 9개 서비스를 모두 컴파일)
sonar.java.binaries=services/*-service/build/classes/java/main
sonar.java.test.binaries=services/*-service/build/classes/java/test

# 커버리지 — 바뀐 서비스만 테스트하므로 그 서비스의 JaCoCo XML 만 존재 (품질 게이트는 새 코드 기준)
sonar.coverage.jacoco.xmlReportPaths=services/*-service/build/reports/jacoco/test/jacocoTestReport.xml
