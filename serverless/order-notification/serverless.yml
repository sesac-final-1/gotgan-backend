# order-notification — SQS(order-events · store-events) → SES 메일(주문 확인 · 배송 시작 · 취소/반품 · 입점 승인 · 반려 · 보완요청, NTF-01~05) + DynamoDB 멱등 · 이력
# 담당 jihoon-devstu · 우선순위 Should · 가이드라인 11장. 서버리스는 배치 · 로깅만 (사용자 API 없음)
# 공유 자원 ARN 은 하드코딩하지 않고 SSM 에서 읽는다 (Terraform app/ssm.tf 가 기록)
service: sesac-gojigi-order-notification
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-northeast-2
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 30
  logRetentionInDays: 14
  environment:
    TABLE: ${ssm:/sesac-gojigi/dev/dynamodb/notifications-table}
    FROM_EMAIL: ${ssm:/sesac-gojigi/dev/ses/from-email}
    FRONT_URL: https://gotgan-ashy.vercel.app        # 메일 속 주문 상세 · 판매자 센터 · 입점 신청 링크
  iam:
    role:
      statements:
        # 발송 이력 · 멱등 — 선점(조건부 Put) · 발송 완료(Update)
        - Effect: Allow
          Action: [dynamodb:PutItem, dynamodb:UpdateItem]
          Resource: arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${ssm:/sesac-gojigi/dev/dynamodb/notifications-table}
        # 메일 — SES 샌드박스는 발신 · 수신 모두 인증된 identity 여야 해서 이 계정의 identity 로 한정
        - Effect: Allow
          Action: [ses:SendEmail]
          Resource: arn:aws:ses:${aws:region}:${aws:accountId}:identity/*

functions:
  notify:
    handler: src/notify.handler
    # 핸들러는 10/21 구현 — order · store 가 이벤트를 발행하기 시작하면 enabled: true 로 켜고 E2E (구지훈)
    events:
      - sqs:
          arn: ${ssm:/sesac-gojigi/dev/sqs/notification-order-queue-arn}
          batchSize: 5
          functionResponseType: ReportBatchItemFailures
          enabled: false                     # 발행 전이라 꺼 둠 — 켜기 전까지 메시지는 큐에 4일 보관
      - sqs:
          arn: ${ssm:/sesac-gojigi/dev/sqs/notification-store-queue-arn}
          batchSize: 5
          functionResponseType: ReportBatchItemFailures
          enabled: false                     # 발행 전이라 꺼 둠 — 켜기 전까지 메시지는 큐에 4일 보관
