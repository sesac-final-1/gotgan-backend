# settlement-report — SQS(SettlementPaid) → 정산 명세서 CSV → S3 reports/{storeId}/{week}.csv → SES 메일(판매자 정산 화면 링크) + DynamoDB 발송 이력
# 담당 jihoon-devstu · 우선순위 Should · 가이드라인 11장. 서버리스는 배치 · 로깅만 (사용자 API 없음)
# 명세서 내용은 이벤트 payload 에 모두 있음(10/21 방식 B). 다운로드 링크는 settlement 가 화면에서 10분 presigned 로 발급(스펙 STL-10) — Lambda 는 서명하지 않는다
# 공유 자원 이름 · ARN 은 하드코딩하지 않고 SSM 에서 읽는다 (Terraform app/ssm.tf 가 기록)
service: sesac-gojigi-settlement-report
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-northeast-2
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 30
  logRetentionInDays: 14
  environment:
    TABLE: ${ssm:/sesac-gojigi/dev/dynamodb/settlement-reports-table}
    BUCKET: ${ssm:/sesac-gojigi/dev/s3/reports-bucket}
    FROM_EMAIL: ${ssm:/sesac-gojigi/dev/ses/from-email}
    FRONT_URL: https://gotgan-ashy.vercel.app        # 메일 속 판매자 정산 화면 링크
  iam:
    role:
      statements:
        # 발송 이력 — 선점(조건부 Put) · 발송 완료(Update)
        - Effect: Allow
          Action: [dynamodb:PutItem, dynamodb:UpdateItem]
          Resource: arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${ssm:/sesac-gojigi/dev/dynamodb/settlement-reports-table}
        # 명세서 CSV 쓰기 — reports/ 아래만
        - Effect: Allow
          Action: [s3:PutObject]
          Resource: arn:aws:s3:::${ssm:/sesac-gojigi/dev/s3/reports-bucket}/reports/*
        # 메일 — SES 샌드박스는 발신 · 수신 주소 모두 인증된 identity 여야 해서 이 계정의 identity 로 한정
        - Effect: Allow
          Action: [ses:SendEmail]
          Resource: arn:aws:ses:${aws:region}:${aws:accountId}:identity/*

functions:
  report:
    handler: src/report.handler
    events:
      - sqs:
          arn: ${ssm:/sesac-gojigi/dev/sqs/report-settlement-queue-arn}
          batchSize: 1                         # 정산서 1건 = 메일 1통 — 실패 단위를 작게
          functionResponseType: ReportBatchItemFailures
